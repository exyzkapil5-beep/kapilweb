<style>

@keyframes zoom
{
    from{transform:scale(0);}
    to{transform:scale(1);}
}

header
{
width:50%;
background:black;
color:white;
font-size:50px;
box-shadow:10px 10px 10px gray;
font-family:Arial black;
text-align:center;
padding:10px;
margin:auto;
margin-bottom:20px;
}

.picstyle
{
width:200px;
height:200px;
margin:40px;
box-shadow:10px 10px 10px gray;
border-radius:40px;
transition:0.20s;
animation:zoom 1s;
}

.picstyle:hover
{
transform:scale(2.00);
}

main
{
width:80%;
margin:auto;
}

.back-btn {
    position: fixed;
    top: 20px;
    left: 1px;

    color: #000000;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;

    cursor: pointer;
    user-select: none;

    z-index: 9999;

    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #30e7fc;
}

.back-btn:active {
    animation: blink 0.3s ease;
}
</style>

<body>

</main>

</html>
