<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop-up Contact Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Trigger Button */
        .open-btn {
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: background-color 0.3s, transform 0.2s;
        }

        .open-btn:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }

        /* Modal Overlay Background */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-in-out;
            z-index: 1000;
        }

        /* Modal Active Class (When Triggered) */
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Pop-up Card Box */
        .popup-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            position: relative;
            transform: scale(0.7);
            transition: transform 0.3s ease-in-out;
        }

        .modal-overlay.active .popup-card {
            transform: scale(1);
        }

        /* Close Cross Icon */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #64748b;
            cursor: pointer;
            border: none;
            background: none;
            line-height: 1;
        }

        .close-btn:hover {
            color: #0f172a;
        }

        .popup-card h2 {
            color: #0f172a;
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #3b82f6;
            display: inline-block;
            padding-bottom: 4px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            height: 80px;
        }

        .submit-btn {
            width: 100%;
            background-color: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        .submit-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <!-- Open Pop-up Button -->
    <button class="open-btn" id="openModal">Contact Us</button>

    <!-- Pop-up Overlay & Container -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="popup-card">
            <button class="close-btn" id="closeModal">&times;</button>
            
            <div style="text-align: center;">
                <h2>Get In Touch</h2>
            </div>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Apna naam likhein" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Apna address likhein..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <!-- Small JavaScript for Open/Close Logic -->
    <script>
        const openBtn = document.getElementById('openModal');
        const closeBtn = document.getElementById('closeModal');
        const modalOverlay = document.getElementById('modalOverlay');

        // Open Pop-up
        openBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        // Close Pop-up on Cross click
        closeBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close Pop-up on Outside click
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>

</body>
</html>
