<style>.back-btn {
    position: fixed;
    top: 2px;
    left: 0px;

    color: #000000;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;

    cursor: pointer;
    user-select: none;

    z-index: 9999;

    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #30e7fc;
}

.back-btn:active {
    animation: blink 0.3s ease;
}
.{
  position: absolute;
  left: 100px;  
  top: 1px;
}

</style> 
  <body>
    <h1 class="text">creating Element In javascript</h1>
     <h1> ←Click this image </h1>
    <script>
      var p = document.createElement("img");
      document.body.appendChild(p);
      p.src = "image/61.jpg";
      p.style = "width:30%;cursor:pointer;";
      p.style.boxShadow = "10px 10px 10px gray";
      p.style.border = "2px blue ridge";
      p.style.borderRadius = "10px";

      p.onclick = function () {
        p.src = "image/1.png";
        document.bgColor = "black";
      };
      p.onclick = function () {
        p.src = "image/10.jpg";
        document.bgColor = "white";
      };

      p.onmouseout = function () {
        p.src = "image/61.jpg";
        document.bgColor = "white";
      };
      
    </script>
  </body>
</html>
