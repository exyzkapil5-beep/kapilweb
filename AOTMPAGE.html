<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Works</title>
    <style>
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
        }

        .main-header {
            background-color: #1e293b;
            color: #ffffff;
            text-align: center;
            padding: 25px 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .main-header h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        
        .container {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            max-width: 1100px;
            width: 90%;
            margin: 50px auto;
        }

       
        .card-link {
            flex: 1;
            text-decoration: none;
            color: inherit;
            display: block;
        }

       
        .box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }

        
        .card-link:hover .box {
            transform: translateY(-8px);
            box-shadow: 0 16px 24px rgba(0, 0, 0, 0.15);
        }

        .box h2 {
            color: #0f172a;
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #3b82f6;
            display: inline-block;
            padding-bottom: 5px;
        }

     
        .box-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin: 15px 0;
            display: block;
        }

        .box p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
        }

       
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

   
    <header class="main-header">
        <h1>Practice Works</h1>
    </header>

   
    <div class="container">

        <a href="arena-animation.html" class="card-link">
            <div class="box left-box">
                <h2>Project One</h2>
                <!-- Image Tag -->
                <img src="images/arena-animation.webp" class="box-image">
                <p>ARENA ANIMATION</p>
            </div>
        </a>

        
        <a href="AOTM-2.HTML" class="card-link">
            <div class="box right-box">
                <h2>Project Two</h2>
                <!-- Image Tag -->
                <img src="https://via.placeholder.com/500x300" alt="Right Box Image" class="box-image">
                <p>PROJECT TWO</p>
            </div>
        </a>

    </div>

</body>
</html>
