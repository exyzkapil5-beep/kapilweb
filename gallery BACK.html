<!DOCTYPE html>
<html>
<head>
<title>Photo Gallery</title>
<style>
  @keyframes myani {
      from {transform: scale(3);}
      to {transform: scale(1);}
  }

  header {
      width: 50%;
      background: black;
      color: white;
      font-size: 50px;
      box-shadow: 10px 10px 10px gray;
      font-family: 'Arial Black';
      text-align: center;
      padding: 10px;
      margin: auto;
  }

  .picstyle2 {
      width: 70%;
      margin: 40px;
      margin-top: 10px;
      box-shadow: 10px 10px 10px gray;
      animation: myani 1.50s ease-out;
  }

  main {
      width: 100%;
      margin: auto;
      text-align: center;
  }
  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;

    color: #000000;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;

    cursor: pointer;
    user-select: none;

    z-index: 9999;

    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #30e7fc;
}

.back-btn:active {
    animation: blink 0.3s ease;
}
</style>
</head>
<a href="page.html" class="back-btn">
    ← Back
</a>
