<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 80px 20px 30px;
    }

    /* Back Button */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 22px;
      border: none;
      border-radius: 6px;
      background: gray;
      color: white;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
    }

    .back-btn:hover {
      background: #444;
    }

    /* Box */
    .box {
      width: 320px;
      height: 420px;              /* Fixed Big Height */
      background: white;
      text-align: center;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px #aaa;
      transition: 0.4s;

      display: flex;
      flex-direction: column;
    }

    .box:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 15px 30px #888;
    }

    /* Image */
    .box img {
      width: 100%;
      height: 320px;              /* Fixed Image Height */
      object-fit: cover;
      display: block;
    }

    /* Name */
    .box-content {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box h2 {
      margin: 0;
      font-size: 24px;
    }

    /* Tablet */
    @media (max-width: 768px) {
      .box {
        width: 45%;
        height: 380px;
      }

      .box img {
        height: 280px;
      }
    }

    /* Phone */
    @media (max-width: 600px) {
      body {
        flex-direction: column;
        gap: 20px;
      }

      .box {
        width: 100%;
        max-width: 350px;
        height: 420px;
      }

      .box img {
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <button class="back-btn" onclick="history.back()">← Back</button>

  <div class="box">
    <img src="arena.jpg" alt="Arena Animation">
    <div class="box-content">
      <h2>Arena Animation</h2>
    </div>
  </div>

  <div class="box">
    <img src="olympic.jpg" alt="Olympic Sports">
    <div class="box-content">
      <h2>Olympic Sports</h2>
    </div>
  </div>

</body>
</html>
