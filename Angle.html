<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes ani1 {
            from {
                transform: rotateY(0deg) rotateX(0deg);
            }
            to {
                transform: rotateY(360deg) rotateX(10deg) rotateZ(360deg) scaleY(108%) scaleX(108%);
            }
        }

        #container {
            width: 400px;
            height: 400px;
            background: black;
            margin: auto;
            perspective: 400px;
        }

        #box {
            color: white;
            background: red;
            width: 150px;
            height: 150px;
            position: absolute;
            left: 100px;
            top: 100px;
            background: url(image/19.jpg);
            background-size: cover;
            animation: ani1 6s infinite alternate;
        }

        #box2 {
            color: rgb(59, 13, 13);
            background: rgb(243, 179, 18);
            width: 150px;
            height: 150px;
            position: absolute;
            left: 100px;
            background: url(image/22.jpg
            );
            background-size: cover;
            backface-visibility: hidden;
            top: 100px;
            animation: ani1 6s infinite alternate;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="box">
        
        </div>
        <div id="box2">
        
        </div>
    </div>
</body>
</html>
