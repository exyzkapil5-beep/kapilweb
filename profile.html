<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kapil Portfolio</title>
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body>
    <header class="main-header">
      <nav class="nav-bar">
        <div class="brand-logo">PROFILE</div>
        <div class="nav-menu">
          <a href="arena-animation-redesign.1(1) (1).html">Home</a>
          <a href="page.html">Practice Work</a>
          <a href="arena-animation-redesign.1(1) (1).html">Contact</a>
        </div>
      </nav>
    </header>

    <section id="hero">
      <div class="hero-container">
        <div class="hero-text">
          <h1>I Am Kapil UI/UX Designer</h1>
          <p>
            This is my simple website: a personal portfolio I created to
            showcase who I am, my skills, and my best work. It is clean, simple,
            and easy to navigate.
          </p>
        </div>
        <div class="hero-image-wrap">
          <div class="avatar-holder">
            <img src="image/me.1.jpeg" alt="Kapil" class="avatar-img" />
          </div>
        </div>
      </div>
    </section>

    <section id="portfolio">
      <h2 class="grid-title">Work</h2>
      <div class="projects-grid">
        <div class="project-card">
          <a
            href="page.html"
            style="text-decoration: none; color: inherit; display: block"
          >
            <div class="card-image-box">
              <img
                src="https://cdn.prod.website-files.com/689f57851a99a1bd30926f91/68c05ab94c84288d1f23d608_What-is-Creative-Coding.png"
                alt="Project"
                class="card-img"
              />
            </div>
            <div class="card-details">
              <h3>Practice Work</h3>
              <p>UX Research</p>
            </div>
          </a>
        </div>
      </div>
    </section>

    <footer id="main-footer">
      <div class="footer-wrap">
        <div class="footer-links">
          <a href="mailto:exyzkapil5@gmail.com">Email</a>
          <a href="https://www.linkedin.com/in/kapil-mehra-36bb35414/"
            >LinkedIn</a
          >
          <a href="https://www.behance.net/kapilmehra5">Behance</a>
        </div>
      </div>
    </footer>

    <button
      id="scrollToTopBtn"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
    >
      ↑
    </button>

    <script>
      window.onscroll = function () {
        const btn = document.getElementById("scrollToTopBtn");
        if (
          document.body.scrollTop > 200 ||
          document.documentElement.scrollTop > 200
        ) {
          btn.style.display = "flex";
        } else {
          btn.style.display = "none";
        }
      };
    </script>
  </body>
</html>
