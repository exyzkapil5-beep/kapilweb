<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <style>
        * .back-btn {
    position: fixed;
    top: 2px;
    left: 0px;

    color: #0b0b0b;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;

    cursor: pointer;
    user-select: none;

    z-index: 9999;

    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #30e7fc;
}

.back-btn:active {
    animation: blink 0.3s ease;
}
        
        
        { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        #menu-wrapper { margin: 30px; display: inline-block; position: relative; }
        .ri-menu-line { font-size: 30px; cursor: pointer; color: #216b92; }

      
        .menu-list {
            list-style: none;
            position: absolute;
            left: 40px; 
            top: 0;
            display: flex;
            gap: 10px;
            visibility: hidden;
        }

        .menu-list li {
            background: #366279;
            padding: 10px 20px;
            border-radius: 5px;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.4s ease;
        }

        .menu-list li a { color: white; text-decoration: none; white-space: nowrap; }

        
        #menu-wrapper:hover .menu-list { visibility: visible; }
        #menu-wrapper:hover .menu-list li {
            opacity: 1;
            transform: translateX(0); 
        }

        
        #menu-wrapper:hover .menu-list li:nth-child(1) { transition-delay: 0.0s; }
        #menu-wrapper:hover .menu-list li:nth-child(2) { transition-delay: 0.1s; }
        #menu-wrapper:hover .menu-list li:nth-child(3) { transition-delay: 0.2s; }
        #menu-wrapper:hover .menu-list li:nth-child(4) { transition-delay: 0.3s; }
    </style>
</head>
