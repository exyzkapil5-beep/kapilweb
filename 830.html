<style>
.box
{
    width: 30%;
    height: 160px;
    border: 1px black solid;
    box-shadow: 10px 10px 10px gray;
    border-radius: 10px;
    transition: 2s;
    text-align: center;


}
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;

    color: #000000;
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;

    cursor: pointer;
    user-select: none;

    z-index: 9999;

    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #30e7fc;
}

.back-btn:active {
    animation: blink 0.3s ease;
}

 .box {
    position: absolute;
    background: rgb(77, 255, 0);
    left: 180px;
    top: 150px;
 }
</style> 

<a href="page.html" class="back-btn">
    ← Back
</a>
